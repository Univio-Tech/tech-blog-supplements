# Catalog of AWS services this skill recognizes. Add a new service here, never in SKILL.md or
# output-template.md.
#
# Key: lowercase, no-space lookup id (never printed).
#   heading: display name for report headings, e.g. "### Lambda: `<resource-name>`"
#   fields:  report bullets for this service, a subset of [settings, iam, env]

services:
  # Compute
  lambda:
    heading: Lambda
    fields: [settings, iam, env]
  ecs:
    heading: ECS
    fields: [settings, iam]
  fargate:
    heading: Fargate
    fields: [settings, iam]

  # Integration & messaging
  sqs:
    heading: SQS
    fields: [settings, iam]
  eventbridge:
    heading: EventBridge
    fields: [settings, iam]
  sns:
    heading: SNS
    fields: [settings, iam]
  stepfunctions:
    heading: StepFunctions
    fields: [settings, iam]

  # Database
  dynamodb:
    heading: DynamoDB
    fields: [settings, iam]
  rds:
    heading: RDS
    fields: [settings, iam]
  elasticache:
    heading: ElastiCache
    fields: [settings, iam]

  # Storage & other
  s3:
    heading: S3
    fields: [settings, iam]
  ecr:
    heading: ECR
    fields: [settings, iam]
  apigateway:
    heading: API Gateway
    fields: [settings, iam]
  cloudwatch:
    heading: CloudWatch
    fields: [settings, iam]
  kms:
    heading: KMS
    fields: [settings, iam]
  vpcendpoints:
    heading: VPC Endpoints
    fields: [settings, iam]
  route53:
    heading: Route53
    fields: [settings, iam]
